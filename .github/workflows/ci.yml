name: CI Pipeline — Build & Trigger Jenkins

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1: Test — type-check + unit tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run unit tests
        run: npm run test
        env:
          CI: true

  # ─────────────────────────────────────────────
  # STAGE 2: Build — Maven packages WAR artifact
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Maven Build (WAR)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20 (needed by frontend-maven-plugin)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build WAR with Maven (tests already ran above)
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-roadmap-war
          path: target/*.war
          retention-days: 5

  # ─────────────────────────────────────────────
  # STAGE 3: Trigger Jenkins (main branch only)
  # ─────────────────────────────────────────────
  trigger-jenkins:
    name: 🚀 Trigger Jenkins Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate Jenkins secrets are configured
        run: |
          if [ -z "${{ secrets.JENKINS_URL }}" ]; then
            echo "❌ ERROR: JENKINS_URL secret is not set in GitHub repository settings."
            echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "   Name: JENKINS_URL"
            echo "   Value: http://<your-ec2-public-ip>:8080"
            exit 1
          fi
          if [ -z "${{ secrets.JENKINS_TOKEN }}" ]; then
            echo "❌ ERROR: JENKINS_TOKEN secret is not set in GitHub repository settings."
            echo "   Name: JENKINS_TOKEN"
            echo "   Value: The token configured in your Jenkins Generic Webhook Trigger plugin"
            exit 1
          fi
          echo "✅ Jenkins secrets are configured."

      - name: Notify Jenkins via Generic Webhook
        run: |
          echo "Triggering Jenkins pipeline on EC2..."
          HTTP_STATUS=$(curl --silent --show-error \
            --max-time 30 \
            --write-out "%{http_code}" \
            --output /tmp/jenkins_response.txt \
            -X POST \
            "${{ secrets.JENKINS_URL }}/generic-webhook-trigger/invoke?token=${{ secrets.JENKINS_TOKEN }}")
          echo "Jenkins response body:"
          cat /tmp/jenkins_response.txt
          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -gt 299 ]; then
            echo "❌ Jenkins trigger failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Jenkins pipeline triggered successfully."
