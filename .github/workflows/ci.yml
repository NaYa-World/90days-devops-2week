name: CI Pipeline — Build & Trigger Jenkins

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────────
  # STAGE 1: Test — type-check + unit tests
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Run unit tests
        run: npm run test
        env:
          CI: true

  # ─────────────────────────────────────────────
  # STAGE 2: Build — Maven packages WAR artifact
  # ─────────────────────────────────────────────
  build:
    name: 🏗️ Maven Build (WAR)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20 (needed by frontend-maven-plugin)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build WAR with Maven (tests already ran above)
        run: mvn clean package -DskipTests --batch-mode

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops-roadmap-war
          path: target/*.war
          retention-days: 5

  # ─────────────────────────────────────────────
  # STAGE 3: Trigger Jenkins (main branch only)
  # ─────────────────────────────────────────────
  trigger-jenkins:
    name: 🚀 Trigger Jenkins Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Notify Jenkins via Generic Webhook
        run: |
          echo "Triggering Jenkins pipeline on EC2..."
          RESPONSE=$(curl --silent --show-error --fail \
            --max-time 30 \
            -X POST \
            "${{ secrets.JENKINS_URL }}/generic-webhook-trigger/invoke?token=${{ secrets.JENKINS_TOKEN }}")
          echo "Jenkins response: $RESPONSE"
